<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terminal Command Hub | DevTools Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="main-container">
        <div class="container py-4">
            <!-- Hero Section -->
            <div class="hero-section">
                <div class="badge-pro">
                    <i class="fas fa-terminal me-2"></i>Developer Tools
                </div>
                <h1>
                    <i class="fas fa-code"></i> Terminal Command Hub
                </h1>
                <p class="lead">
                    Coleção profissional de comandos essenciais para diagnóstico de sites, DNS e e-mails
                </p>
            </div>

            <!-- Stats Section -->
            <div class="stats-container" id="statsContainer"></div>

            <!-- Search & Filter Section -->
            <div class="search-section">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" class="search-input" id="searchInput"
                                placeholder="Buscar comandos por título, descrição ou comando...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="filter-buttons" id="filterButtons"></div>
                    </div>
                </div>
            </div>

            <!-- Commands Container -->
            <div id="commandsContainer"></div>

            <!-- Footer -->
            <div class="footer">
                <p><i class="fas fa-terminal me-2"></i>Terminal Command Hub v2.0 | Desenvolvido para profissionais de
                    infraestrutura e desenvolvimento</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
